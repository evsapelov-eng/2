name: PLUIT Assistent

on:
  schedule:
    # 09:07, 12:07, 15:07, 18:07, 21:07 по Москве (UTC+3). Смещение на 7 минут
    # уменьшает задержки GitHub в начале часа. Точное время не гарантируется.
    - cron: '7 6,9,12,15,18 * * *'
  workflow_dispatch:

# Не более одного запуска одновременно. Новый запуск ждёт завершения текущего.
concurrency:
  group: pluit-assistent
  cancel-in-progress: false

# contents: write нужен только для сохранения зашифрованного состояния в ветку bot-state.
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: python -m pip install --quiet -e .

      - name: Запуск помощника
        run: python -m app.main
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DISCUSSION_GROUP_ID: ${{ secrets.DISCUSSION_GROUP_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          # Необязательные переопределения config/settings.yaml (Settings → Variables → Actions).
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL }}
          NOTIFICATION_THRESHOLD: ${{ vars.NOTIFICATION_THRESHOLD }}
          NOTIFICATION_MODE: ${{ vars.NOTIFICATION_MODE }}
          MAX_RECOMMENDATIONS_PER_RUN: ${{ vars.MAX_RECOMMENDATIONS_PER_RUN }}
          MAX_AI_REQUESTS_PER_RUN: ${{ vars.MAX_AI_REQUESTS_PER_RUN }}
          MAX_AI_REQUESTS_PER_DAY: ${{ vars.MAX_AI_REQUESTS_PER_DAY }}
          WEEKLY_REPORT_ENABLED: ${{ vars.WEEKLY_REPORT_ENABLED }}
          DATA_RETENTION_DAYS: ${{ vars.DATA_RETENTION_DAYS }}
          TIMEZONE: ${{ vars.TIMEZONE }}
