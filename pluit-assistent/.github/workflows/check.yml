name: Проверка настройки

# Запускается только вручную: Actions → «Проверка настройки» → Run workflow.
# Не читает очередь обновлений Telegram и не меняет состояние бота.
on:
  workflow_dispatch:
    inputs:
      test_gemini:
        description: 'Сделать один тестовый запрос к Gemini (расходует 1 запрос квоты)'
        type: boolean
        default: false
      send_test_message:
        description: 'Отправить владельцу тестовое сообщение'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e .
      - run: python scripts/check_setup.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DISCUSSION_GROUP_ID: ${{ secrets.DISCUSSION_GROUP_ID }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TEST_GEMINI: ${{ inputs.test_gemini }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message }}
