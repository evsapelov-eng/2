[project]
name = "pluit-assistent"
version = "0.1.0"
description = "PLUIT Assistent — личный помощник автора канала PLUIT Club"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "google-genai>=1.30,<4",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108", "SIM105", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
